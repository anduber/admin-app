<div class="button-showcase">
  <h1>Button Component</h1>

  <section>
    <h2>Primary</h2>
    <div class="button-showcase__examples">
      <app-button>Primary Button</app-button>
      <app-button size="large">Large Primary</app-button>
    </div>
  </section>

  <section>
    <h2>Outline</h2>
    <div class="button-showcase__examples">
      <app-button variant="outline">Outline Button</app-button>
      <app-button variant="outline">Withdraw All Earnings</app-button>
    </div>
  </section>

  <section>
    <h2>Text</h2>
    <div class="button-showcase__examples">
      <app-button variant="text">Text Button</app-button>
    </div>
  </section>

  <section>
    <h2>States</h2>
    <div class="button-showcase__examples">
      <app-button [disabled]="true">Disabled Button</app-button>
      <app-button type="submit">Submit</app-button>
    </div>
  </section>
</div>

<div class="text-field-showcase">
  <h1>TextField Component</h1>

  <section class="text-field-showcase__examples">
    <app-text-field placeholder="Enter text" />
    <app-text-field label="Enter text" placeholder="Enter text" />
    <app-text-field label="Email" type="email" placeholder="Enter email" />
    <app-text-field label="Password" type="password" placeholder="Enter password" />
    <app-text-field label="Disabled" placeholder="Disabled field" [disabled]="true" />
    <app-text-field label="Readonly" placeholder="Readonly field" [readonly]="true" />
    <app-text-field label="Location" placeholder="Germany">
      <span textFieldPrefix aria-hidden="true">⌖</span>
    </app-text-field>
  </section>

  <section>
    <h2>Reactive Form</h2>
    <form class="text-field-showcase__examples" [formGroup]="form">
      <app-text-field
        label="Email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        name="email"
        formControlName="email"
      />
      <app-text-field
        label="Password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        name="password"
        formControlName="password"
      />
    </form>
  </section>
</div>
