<div class="text-field" [class.text-field--disabled]="isDisabled()">
  @if (label()) {
    <label class="text-field__label" [attr.for]="resolvedId()">{{ label() }}</label>
  }

  <div class="text-field__control">
    <span class="text-field__prefix"><ng-content select="[textFieldPrefix]" /></span>

    <input
      class="text-field__input"
      [id]="resolvedId()"
      [type]="inputType()"
      [value]="value() ?? ''"
      [attr.placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [attr.name]="name()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-label]="label() ? null : (ariaLabel() ?? placeholder())"
      (input)="handleInput($event)"
      (blur)="markTouched()"
    />

    @if (type() === 'password') {
      <button
        class="text-field__visibility-toggle"
        type="button"
        [disabled]="isDisabled()"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-controls]="resolvedId()"
        (click)="togglePasswordVisibility()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
          @if (passwordVisible()) {
            <path d="m3 3 18 18" />
          }
        </svg>
      </button>
    }
  </div>
</div>
